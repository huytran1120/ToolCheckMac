name: ToolCheckMacBook
options:
  bundleIdPrefix: com.toolcheckmacbook
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_HARDENED_RUNTIME[config=Release]: YES
    CODE_SIGN_STYLE: Automatic
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH[config=Release]: NO

targets:
  ToolCheckMacBook:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: ToolCheckMacBook
        CFBundleShortVersionString: "1.3.3"
        CFBundleVersion: "7"
        NSCameraUsageDescription: Used for camera testing to verify video clarity and check for sensor defects.
        NSMicrophoneUsageDescription: Used for microphone testing to verify audio recording functionality.
        NSBluetoothAlwaysUsageDescription: Used for Bluetooth testing to scan nearby devices and verify RF functionality.
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toolcheckmacbook
        INFOPLIST_FILE: Sources/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Sources/App/ToolCheckMacBook.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ToolCheckMacBookTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: ToolCheckMacBook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toolcheckmacbook.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ToolCheckMacBook:
    build:
      targets:
        ToolCheckMacBook: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ToolCheckMacBookTests
