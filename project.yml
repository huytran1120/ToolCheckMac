name: MacCheck
options:
  bundleIdPrefix: com.berryxia.maccheck
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic

targets:
  MacCheck:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: MacCheck
        CFBundleShortVersionString: "1.2"
        CFBundleVersion: "3"
        NSCameraUsageDescription: Used for camera testing to verify video clarity and check for sensor defects.
        NSMicrophoneUsageDescription: Used for microphone testing to verify audio recording functionality.
        NSBluetoothAlwaysUsageDescription: Used for Bluetooth testing to scan nearby devices and verify RF functionality.
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.berryxia.maccheck
        INFOPLIST_FILE: Sources/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Sources/App/MacCheck.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
